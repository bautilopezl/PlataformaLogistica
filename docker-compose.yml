name: logistica

services:
  postgres:
    image: postgres:16
    container_name: logistica-postgres
    environment:
      POSTGRES_DB: ${PG_DB:-logistica}
      POSTGRES_USER: ${PG_ADMIN_USER:-logistica_admin}
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?definir PG_ADMIN_PASSWORD en .env}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_ADMIN_USER:-logistica_admin} -d ${PG_DB:-logistica}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    container_name: logistica-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ADMIN_USER:-logistica_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ADMIN_PASSWORD:?definir MONGO_ADMIN_PASSWORD en .env}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5-community
    container_name: logistica-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?definir NEO4J_PASSWORD en .env}
      # Nombre sin prefijo NEO4J_: la imagen trata toda NEO4J_* como ajuste de configuración.
      HC_PASSWORD: ${NEO4J_PASSWORD}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$HC_PASSWORD\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

volumes:
  pg_data:
  mongo_data:
  neo4j_data:
